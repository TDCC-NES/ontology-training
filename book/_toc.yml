# Configuration of _toc.yml file is explained in detail here: https://jupyterbook.org/en/stable/structure/toc.html and https://sphinx-external-toc.readthedocs.io/en/latest/user_guide/sphinx.html

format: jb-book
root: intro.md

defaults:
  titlesonly: false
  maxdepth: -1

parts:
  - caption: Curriculum
    numbered: true
    chapters:
    - file: curriculum/introduction-to-ontologies.md
    - file: curriculum/linked-data-foundations.md
    - file: curriculum/design-your-own-ontology.md
    - file: curriculum/build-your-ontology-in-owl.md
    - file: curriculum/logical-modelling-in-owl.md
      sections:
      - file: curriculum/defining-classes-in-owl.md
      - file: curriculum/properties-and-identity-in-owl.md
      - file: curriculum/understanding-owl-reasoning.md
      - file: curriculum/advanced-owl-modelling.md
      - file: curriculum/owl2-cheat-sheet.md
        title: OWL 2 cheat sheet (reference)
    - file: curriculum/check-your-ontology.md
    - file: curriculum/use-your-ontology.md
    - file: curriculum/test-with-data.md
    - file: curriculum/publish-your-ontology.md
    - file: curriculum/maintain-your-ontology.md
    - file: curriculum/map-to-external-ontologies.md
    - file: curriculum/beyond-linked-data.md
  - caption: Miscellaneous
    chapters:
    - file: references.md
    - file: credits.md
