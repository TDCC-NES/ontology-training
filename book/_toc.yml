# Configuration of _toc.yml file is explained in detail here: https://jupyterbook.org/en/stable/structure/toc.html and https://sphinx-external-toc.readthedocs.io/en/latest/user_guide/sphinx.html

format: jb-book
root: intro.md

parts:
  - caption: About this book
    chapters:
    - file: overview.md
    - file: how-to-use.md
  - caption: Curriculum
    numbered: true
    chapters:
    - file: curriculum/introduction.md
      sections:
      - file: curriculum/running-example.md
    - file: curriculum/linked-data-foundations.md
    - file: curriculum/owl2-deep-dive.md
    - file: curriculum/build-your-own-ontology.md
    - file: curriculum/use-your-ontology.md
    - file: curriculum/map-to-external-ontologies.md
    - file: curriculum/beyond-linked-data.md
  - caption: Miscellaneous
    chapters:
    - file: references.md
    - file: credits.md
